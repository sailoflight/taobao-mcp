[browser]
channel = "chrome"      # portable default; override per machine in config.local.toml
executable_path = ""    # optional absolute browser path belongs in config.local.toml
user_data_dir = "./user_data/chrome_profile"
locale = "zh-CN"
timezone = "Asia/Shanghai"
headless = false              # ALWAYS false. Human watches & solves captcha.

[pacing]
min_delay_s = 2.0             # random wait between actions
max_delay_s = 6.0
scroll_steps = 4              # incremental scroll to trigger lazy load
max_products_per_minute = 6  # hard cap; never burst

[click]
# Human-like simulated click (pacing.human_click). Keep it a real person's reach (~0.5s) —
# over the remote bridge each mouse.move step round-trips, so many steps make a click take
# SECONDS and look MORE robotic. Tune here without touching code.
enabled = true                # false → plain locator.click() (instant)
path_steps_min = 4            # animated mouse-path steps during approach
path_steps_max = 9
move_pause_min = 0.01         # s, pause between approach segments
move_pause_max = 0.05
hover_pause_min = 0.04        # s, pause at element before pressing
hover_pause_max = 0.12
hold_min = 0.04               # s, press-and-hold before release
hold_max = 0.12
jitter_px = 2.5               # micro-jitter radius at target (px)
off_center = 0.15             # aim drift from center (fraction of box)

[limits]
max_reviews = 60             # per product, paginated
review_pages = 4
fav_flow_per_day = 30            # daily cap on the 收藏链路 (favorite flow)
review_sample_per_rating = 3     # 评论聚合: 好/中/差评各取 N 条(防被注入好评)

[output]
dir = "./output"

[detail]
# Account/channel marketing id. When present in the item URL (?id=...&mi_id=...), the
# SSR renders the full 图文详情 (.desc-root); without it the page has no 详情 at all.
# Discovered live 2026-08-18 (see NOTES.md). This is ACCOUNT-SPECIFIC — keep it in the
# gitignored config.local.toml (or it's set at runtime by taobao_get_miid → output/.miid.json).
mi_id = ""

[anti_risk]
# 防风控参数全量集中体现(每一项对应一个运行时防护动作)。运行时修改请用 taobao_config 工具
# (写入 gitignored output/.config_overrides.toml, 不污染本文件), 首次 set 需人工二次确认。
captcha_timeout_s = 300        # 验证码人工清除有界等待上限; 超时抛 CaptchaError, 绝不自动解决
captcha_poll_s = 3.0           # 验证码轮询间隔(秒)
login_timeout_s = 180          # QR 登录等待人工扫码上限(秒)
search_cooldown_s = 45         # 两次 taobao_search 之间最小间隔(秒, 全局跨调用) — 直接URL连搜是滑块首因
track_cache = true             # 物流/库存每日首次实机+同日缓存(零流量); false=每次实机
fav_flow = true                # 收藏链路(miid 细查)总开关; false=禁止任何收藏动作
miid_channel = "auto"          # miid 获取渠道(双机制, 用户设计): auto=足迹→收藏兜底 | footmark 仅足迹 | favorite 仅收藏 | config 静态miid
# 足迹渠道: 不耗收藏配额(30/日), 但列表易受用户手动浏览并发扰动 → 打开后校验 opened_id==pid, 不符即退回收藏
# 行为不变量(不可配置, 始终执行): 单标签顺序复用不批量开tab · 优先网络拦截少打DOM ·
# 人类节奏延迟([pacing]) · 人类化模拟点击([click]) · 限速上限(pacing.max_products_per_minute) ·
# 收藏每日配额(limits.fav_flow_per_day)

[compare]
# taobao_compare 默认比价口径: ask(每次询问) | cart(购物车到手价优先) | cart_atomic(购物车无则原子加购读价再退回) | coarse(纯原价)
# 每次调用 compare 会按此在返回头部提示当前口径(配置为 cart/cart_atomic 时明示"即将使用购物车")。
# 运行时改: taobao_config set compare.source <值> (写入 gitignored output/.config_overrides.toml)。
source = "ask"
